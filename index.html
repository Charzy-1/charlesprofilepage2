<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charzy Profile Page</title>
    <link rel="stylesheet" href="style.css">

    <title>Charles Adiks — Junior Frontend Developer</title>

    <!-- Links for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font awesome link for Favicons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
  <!-- That switche that contronls the controls dark/light theme is the line of code that follows thhis comment -->
  <input type="checkbox" id="theme-toggle" class="a11y-toggle">
  
  <div class="site">


    <!-- NAVBAR SECTION -->
    <header class="navbar-container container">
      <div class="nav-inner">

        <a href="#home">
          <span class="logo-dot"></span>
          Charles
          <span class="logo-ascent">.Adiks</span>
        </a>

        <!-- Here comes the Mobile nav checkbox before the navlinks -->
        <input type="checkbox" id="nav-toggle" class="ally-toggle" >

        <label for="nav-toggle" class="hamburger" aria-label="Open menu"> 
          <span></span>
          <span></span>
          <span></span>
        </label>

        <!-- Navlinks can no come in  -->
        <nav class="nav-links">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#projects">Projects</a>
          <a href="skills">Skills</a>
          <a href="#contacts">Contacts</a>
        </nav>

          <label for="theme-toggle" class="theme-switch" aria-label="Toggle dark mode">
          <span class="theme-switch__track">

            <!-- sun icon -->
            <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true">
              ☀
            </span>

            <!-- Moon icon -->
            <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true">
              ☾
            </span>

            <span class="theme-switch__thumb"></span>

          </span>
        </label>

      </div>
    </header>


  </div>

  
</body>
</html>
